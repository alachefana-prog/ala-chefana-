</div>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>  
const SUPABASE_URL = 'https://rwlfmsflwzayzovnzynr.supabase.co';  
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_GLpIItEzLpzoZenpRd-sIw_UHvgWlts';  
const NOMOR_WA = '6281917734172';  
    
let keranjang = [];  
    
async function tesKoneksi() {  
  const box = document.getElementById('menu');  
  
  try {  
    if (!window.supabase) {  
      throw new Error('Library Supabase tidak termuat');  
    }  
  
    const client = window.supabase.createClient(

    const { data, error } = await client  
      .from('menu')

    if (error) {  
      throw error;  
    }  
      
const inputCari = document.getElementById('cariMenu');  
    const hapusCari = document.getElementById('hapusCari');  
      
    const urutanKategori = [  
  'Fast Food',  
  'Jajanan',  
  'Bakso',  
  'Spaghetti',  
  'Minuman',  
  'Aneka Nasi',  
  'Frozen Food',  
  'Sedia'  
];  
  
function tampilkanMenu() {  
  let hasil = '';  
  const kataKunci = inputCari.value.toLowerCase().trim();  
  
urutanKategori.forEach(kategori => {  
  const kataKunci = inputCari.value.toLowerCase().trim();  
  
const menuKategori = data.filter(item =>  
  item.kategori === kategori &&  
  (  
    item.nama.toLowerCase().includes(kataKunci) ||  
    (item.deskripsi || '').toLowerCase().includes(kataKunci)  
  )  
);  
  
  if (menuKategori.length > 0) {  
    hasil += `  
      <h2 class="judul-kategori">${kategori}</h2>  
    `;  
  
    hasil += menuKategori.map(item => `
  <div class="kartu-menu">

    ${
      item.foto
        ? `<img src="${item.foto}" class="gambar-menu">`
        : ''
    }

    <h2>${item.nama}</h2>
    <p class="harga">Rp ${Number(item.harga).toLocaleString('id-ID')}</p>
    <p>${item.deskripsi || ''}</p>

    ${
      item.tersedia === false
        ? `
          <p style="color:#d85b9b;font-weight:bold;margin-top:8px;">
            🔴 Sedang Habis
          </p>
        `
        : `
          <button
            class="tombol-wa"
            onclick="bukaPopupAdmin('${item.nama}')"
          >
            💬 Pesan via WhatsApp
          </button>

          <button
            class="tombol-tambah"

          >
            🛒
          </button>
        `
    }

  </div>
`).join('');
  }  
});  
  
box.innerHTML = hasil;  
  }  
  
tampilkanMenu();  
  
inputCari.addEventListener('input', () => {  
  tampilkanMenu();  
});  
  
hapusCari.addEventListener('click', () => {  
  inputCari.value = '';  
  tampilkanMenu();  
});  
      
  function tampilkanKeranjang() {  
  const isi = document.getElementById('isiKeranjang');  
    const judul = document.querySelector('#keranjangBox h2');  
judul.innerHTML = `🛒 Keranjang (${keranjang.length})`;  
  if (keranjang.length === 0) {  
    isi.innerHTML = 'Belum ada pesanan';  
    return;  
  }  
  
  const kelompok = {};  
  
keranjang.forEach(item => {  
  if (!kelompok[item.nama]) {  
    kelompok[item.nama] = {  
      nama: item.nama,  
      harga: Number(item.harga),  
      jumlah: 0  
    };  
  }  
  
  kelompok[item.nama].jumlah += 1;  
});  
  
const daftar = Object.values(kelompok);  
let total = 0;  
  
isi.innerHTML = daftar.map(item => {  
  const subtotal = item.harga * item.jumlah;  
  total += subtotal;  
  
  return `  
  <p>  
    ${item.nama} × ${item.jumlah}<br>  
    Rp ${subtotal.toLocaleString('id-ID')}  
  </p>  
`;  
    
}).join('') + `  
  <p><strong>Total: Rp ${total.toLocaleString('id-ID')}</strong></p>  
`;  document.getElementById('isiKeranjangBesar').innerHTML = daftar.map(item => {  
  const subtotal = item.harga * item.jumlah;  
  
  return `  
  <p>  
    <strong>${item.nama}</strong><br>  
      
    <button class="tombol-jumlah" onclick="ubahJumlah('${item.nama}', -1)">−</button>  
    ${item.jumlah}  
    <button class="tombol-jumlah" onclick="ubahJumlah('${item.nama}', 1)">+</button>  
      
    <br>  
    Rp ${subtotal.toLocaleString('id-ID')}  
  </p>  
`;  
    
}).join('') + `  
  <p class="total-keranjang">  
    Total: Rp ${total.toLocaleString('id-ID')}  
  </p>  
`;  
 }  
      
window.ubahJumlah = function(nama, perubahan) {  
  const index = keranjang.findIndex(item => item.nama === nama);  
  
  if (index === -1) return;  
  
  if (perubahan === 1) {  
    keranjang.push({  
      nama: keranjang[index].nama,  
      harga: keranjang[index].harga  
    });  
  } else if (perubahan === -1) {  
    keranjang.splice(index, 1);  
  }  
  
  tampilkanKeranjang();  
};  
      
window.tambahKeranjang = function(nama, harga) {  
  keranjang.push({  
  nama: nama,  
  harga: harga  
});  
  
  tampilkanKeranjang();  
  
  const notifikasi = document.createElement('div');  
  notifikasi.innerHTML = `  
    🛒 <strong>${nama}</strong><br>  
    berhasil ditambahkan ✨  
  `;  
  
  notifikasi.style.position = 'fixed';  
  notifikasi.style.bottom = '20px';  
  notifikasi.style.left = '50%';  
  notifikasi.style.transform = 'translateX(-50%)';  
  notifikasi.style.background = '#fff';  
  notifikasi.style.color = '#4f3b5f';  
  notifikasi.style.padding = '12px 18px';  
  notifikasi.style.borderRadius = '14px';  
  notifikasi.style.boxShadow = '0 4px 15px rgba(0,0,0,0.18)';  
  notifikasi.style.border = '1px solid #e6cf8b';  
  notifikasi.style.fontSize = '14px';  
  notifikasi.style.textAlign = 'center';  
  notifikasi.style.zIndex = '9999';  
  
  document.body.appendChild(notifikasi);  
  
  setTimeout(() => {  
    notifikasi.remove();  
  }, 1800);  
};  
  
  } catch (error) {  
    box.innerHTML = `  
      <h2>Koneksi GAGAL ❌</h2>  
      <p>${error.message}</p>  
    `;  
  }  
}  
const keranjangBox = document.getElementById('keranjangBox');  
  
let sedangGeser = false;  
let offsetX = 0;  
let offsetY = 0;  
  
keranjangBox.addEventListener('pointerdown', (e) => {  
  sedangGeser = true;  
  
  const posisi = keranjangBox.getBoundingClientRect();  
  
  offsetX = e.clientX - posisi.left;  
  offsetY = e.clientY - posisi.top;  
  
  keranjangBox.style.right = 'auto';  
  keranjangBox.style.bottom = 'auto';  
  
  keranjangBox.setPointerCapture(e.pointerId);  
});  
  
keranjangBox.addEventListener('pointermove', (e) => {  
  if (!sedangGeser) return;  
  
  keranjangBox.style.left = (e.clientX - offsetX) + 'px';  
  keranjangBox.style.top = (e.clientY - offsetY) + 'px';  
});  
  
keranjangBox.addEventListener('pointerup', () => {  
  sedangGeser = false;  
});   
  keranjangBox.addEventListener('click', () => {  
  document.getElementById('keranjangBesar').style.display = 'block';  
});  
    
  document.getElementById('tutupKeranjang').addEventListener('click', () => {

});  
  document.getElementById('tombolPesanSemua').addEventListener('click', () => {  
  if (keranjang.length === 0) {  
    return;  
  }  
  
  let pesan = 'Halo, saya mau pesan:%0A%0A';  
  
  const kelompok = {};  
  
  keranjang.forEach(item => {  
    if (!kelompok[item.nama]) {  
      kelompok[item.nama] = {  
        harga: Number(item.harga),  
        jumlah: 0

    }  
  
    kelompok[item.nama].jumlah += 1;  
  });  
  
  let total = 0;  
  
  Object.keys(kelompok).forEach(nama => {  
    const item = kelompok[nama];  
    const subtotal = item.harga * item.jumlah;  
    total += subtotal;  
  
    pesan += `• ${nama} × ${item.jumlah} = Rp ${subtotal.toLocaleString('id-ID')}%0A`;  
  });  
  
  pesan += `%0ATotal: Rp ${total.toLocaleString('id-ID')}`;  
  
  window.open(  
    `https://wa.me/${NOMOR_WA}?text=${pesan}`,  
    '_blank'  
  );  
});  
tesKoneksi();
